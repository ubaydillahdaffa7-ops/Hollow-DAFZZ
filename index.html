
<script>
"use strict";

const loginScreen = document.getElementById("loginScreen");
const appScreen = document.getElementById("appScreen");
const nav = document.getElementById("nav");
const loginForm = document.getElementById("loginForm");
const usernameInput = document.getElementById("username");
const passwordInput = document.getElementById("password");

function toast(message) {
  const el = document.getElementById("toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
}

let myUsername = sessionStorage.getItem("hollow_username") || "";
let socket = null;
const messagesBox = document.getElementById("messages");
const chatForm = document.getElementById("chatForm");
const chatInput = document.getElementById("chatInput");
const chatStatus = document.getElementById("chatStatus");
const displayedMessageIds = new Set();

function enterPanel(username) {
  myUsername = username.trim().slice(0, 24);
  sessionStorage.setItem("hollow_username", myUsername);
  loginScreen.classList.add("hidden");
  appScreen.classList.remove("hidden");
  nav.classList.remove("hidden");
  connectChat();
  toast("Berhasil masuk sebagai " + myUsername);
}

loginForm.addEventListener("submit", function(e) {
  e.preventDefault();

  const username = usernameInput.value.trim().slice(0, 24);
  const password = passwordInput.value;

  if (!username || !password) {
    toast("Isi username dan password.");
    return;
  }

  enterPanel(username);
  passwordInput.value = "";
});

function showPage(pageId) {
  document.querySelectorAll(".page").forEach(p => {
    p.classList.toggle("hidden", p.id !== pageId);
  });

  document.querySelectorAll(".nav button").forEach(b => {
    b.classList.toggle("active", b.dataset.page === pageId);
  });

  window.scrollTo({ top: 0, behavior: "smooth" });
}

nav.querySelectorAll("button").forEach(b => {
  b.addEventListener("click", () => showPage(b.dataset.page));
});

document.querySelectorAll("[data-goto]").forEach(b => {
  b.addEventListener("click", () => showPage(b.dataset.goto));
});

document.getElementById("modeBtn").addEventListener("click", function() {
  document.body.classList.toggle("purple");
  const purple = document.body.classList.contains("purple");
  this.textContent = purple ? "◉ MODE MERAH" : "◉ MODE UNGU";
  toast(purple ? "Tema ungu-hitam aktif" : "Tema merah-hitam aktif");
});

function selectModule(panelId) {
  document.querySelectorAll(".module").forEach(m => {
    m.classList.toggle("hidden", m.id !== panelId);
  });

  document.querySelectorAll(".orbit-node").forEach(b => {
    b.classList.toggle("selected", b.dataset.panel === panelId);
  });

  const names = {
    bugTools: "BUG",
    senderTools: "SENDER",
    banTools: "BAN GROUP",
    customTools: "BUG CUSTOM"
  };

  toast("Menu " + (names[panelId] || "BUG") + " dibuka");
}

document.querySelectorAll(".orbit-node").forEach(b => {
  b.addEventListener("click", () => selectModule(b.dataset.panel));
});

document.querySelectorAll(".back-btn").forEach(b => {
  b.addEventListener("click", () => selectModule(b.dataset.panel));
});

document.querySelectorAll(".sim").forEach(b => {
  b.addEventListener("click", () => {
    toast("SIMULASI: " + (b.dataset.name || "modul") + " — tidak ada aksi nyata.");
  });
});

document.getElementById("customBtn").addEventListener("click", () => {
  const input = document.getElementById("customName");
  const name = input.value.trim();

  if (!name) {
    toast("Isi nama preset visual dulu.");
    return;
  }

  const item = document.createElement("div");
  item.textContent = "✦ Preset tersimpan: " + name;
  document.getElementById("presetList").appendChild(item);
  input.value = "";
  toast('Preset "' + name + '" disimpan sementara.');
});

let senderLinked = false;

function renderSender() {
  const badge = document.getElementById("senderBadge");
  const detail = document.getElementById("senderDetail");
  const label = document.getElementById("senderLabel");

  badge.className = "status-pill " + (senderLinked ? "online" : "offline");
  badge.textContent = senderLinked ? "● SUDAH DITAUTKAN" : "● BELUM DITAUTKAN";

  detail.textContent = senderLinked
    ? "Sender demo aktif: " + (label.value.trim() || "DAFFZZ-DEMO")
    : "Belum ada sender demo yang ditautkan.";

  document.getElementById("linkSenderBtn").textContent = senderLinked
    ? "✓ SENDER DEMO TERTAUT"
    : "🔗 TAUTKAN SENDER DEMO";
}

document.getElementById("linkSenderBtn").addEventListener("click", () => {
  senderLinked = true;

  if (!document.getElementById("senderLabel").value.trim()) {
    document.getElementById("senderLabel").value = "DAFFZZ-DEMO";
  }

  renderSender();
  toast("Sender demo berhasil ditautkan secara lokal ✦");
});

document.getElementById("unlinkSenderBtn").addEventListener("click", () => {
  senderLinked = false;
  renderSender();
  toast("Tautan sender demo diputuskan");
});

document.getElementById("senderLabel").addEventListener("input", () => {
  if (senderLinked) renderSender();
});

function renderChatMessage(data) {
  if (!data || !data.id || displayedMessageIds.has(data.id)) return;

  displayedMessageIds.add(data.id);

  const msg = document.createElement("div");
  msg.className = "msg";

  if (data.username === myUsername) {
    msg.classList.add("mine");
  }

  const label = document.createElement("small");
  const time = data.time ? new Date(data.time) : new Date();

  label.textContent =
    (data.username || "Member") + " • " +
    time.toLocaleTimeString("id-ID", {
      hour: "2-digit",
      minute: "2-digit"
    });

  msg.appendChild(label);
  msg.appendChild(document.createTextNode(String(data.message || "")));
  messagesBox.appendChild(msg);

  while (messagesBox.children.length > 100) {
    messagesBox.removeChild(messagesBox.firstChild);
  }

  messagesBox.scrollTop = messagesBox.scrollHeight;
}

function connectChat() {
  if (typeof window.io !== "function") {
    chatStatus.textContent = "● SOCKET.IO TIDAK TERSEDIA";
    chatStatus.style.color = "#ff7180";
    return;
  }

  if (socket) {
    socket.disconnect();
  }

  socket = window.io();

  socket.on("connect", () => {
    chatStatus.textContent = "● ONLINE";
    chatStatus.style.color = "#71ffb0";

    socket.emit("chat:join", myUsername);
  });

  socket.on("disconnect", () => {
    chatStatus.textContent = "● TERPUTUS";
    chatStatus.style.color = "#ff7180";
  });

  socket.on("connect_error", () => {
    chatStatus.textContent = "● GAGAL TERHUBUNG";
    chatStatus.style.color = "#ff7180";
  });

  socket.on("chat:history", history => {
    messagesBox.replaceChildren();
    displayedMessageIds.clear();

    if (Array.isArray(history)) {
      history.slice(-100).forEach(renderChatMessage);
    }
  });

  socket.on("chat:new", renderChatMessage);

  socket.on("chat:joined", data => {
    if (data && data.message) toast(data.message);
  });
}

chatForm.addEventListener("submit", e => {
  e.preventDefault();

  const message = chatInput.value.trim();

  if (!message) return;

  if (!socket || !socket.connected) {
    toast("Server chat belum terhubung.");
    return;
  }

  socket.emit("chat:send", {
    message: message.slice(0, 1000)
  });

  chatInput.value = "";
});

function updateClock() {
  document.getElementById("clock").textContent =
    new Date().toLocaleTimeString("id-ID", {
      hour: "2-digit",
      minute: "2-digit"
    });
}

updateClock();
setInterval(updateClock, 10000);
renderSender();

if (myUsername) {
  usernameInput.value = myUsername;
  enterPanel(myUsername);
}
</script>
